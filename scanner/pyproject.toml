[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mergeclear"
dynamic = ["version"]
description = "Know what a change breaks before you merge it: API contract and dependency scanner"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Manoj Vihari" }]
keywords = ["api", "breaking-changes", "contract", "spring", "fastapi", "aspnet", "dotnet", "ci", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# same ranges as requirements.in (the tested, locked versions are in requirements.txt)
dependencies = [
    "requests>=2.31,<3",
    # Query/QueryCursor API needs tree-sitter 0.25+; grammars change between minor versions
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-c-sharp>=0.23,<0.24",
    "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/ManojVihari/RepoPilot"
Source = "https://github.com/ManojVihari/RepoPilot/tree/master/scanner"
Changelog = "https://github.com/ManojVihari/RepoPilot/blob/master/CHANGELOG.md"
Issues = "https://github.com/ManojVihari/RepoPilot/issues"

[project.scripts]
mergeclear = "mergeclear.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mergeclear.__version__" }      # the one place the version is written

[tool.setuptools.packages.find]
include = ["mergeclear*"]
